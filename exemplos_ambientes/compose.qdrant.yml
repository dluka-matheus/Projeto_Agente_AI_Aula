services:
  backend:
    build: .
    env_file: .env
    environment:
      VECTOR_PROVIDER: qdrant
      VECTOR_ENDPOINT: http://qdrant:6333
    depends_on:
      qdrant:
        condition: service_started
    restart: 'no'
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - '6333:6333'
    volumes:
      - qdrant_data:/qdrant/storage
volumes:
  qdrant_data:
